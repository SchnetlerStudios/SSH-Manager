<!DOCTYPE html>
<html>
<head><title>Compliance Audit Trail</title></head>
<body>
    <h1>Immutable Compliance Audit Trail</h1>
    <form method="get">
        <input type="text" name="host" placeholder="Filter by Host">
        <input type="text" name="auid" placeholder="Filter by AUID">
        <button type="submit">Filter</button>
    </form>
    <table border="1">
        <thead>
            <tr>
                <th>Timestamp</th><th>Host</th><th>AUID</th><th>Event Type</th><th>Exe</th><th>Command</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
            <tr>
                <td>{{ event.timestamp }}</td>
                <td>{{ event.host_identifier }}</td>
                <td>{{ event.auid }}</td>
                <td>{{ event.event_type }}</td>
                <td>{{ event.exe }}</td>
                <td>{{ event.command }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
