<!DOCTYPE html>
<html lang="en">
<head><title>Create Access Request</title></head>
<body>
    <h1>Submit New Access Request</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_hosts">Target Hosts/Pattern <span aria-hidden="true" style="color: red;">*</span>:</label>
            <input type="text" id="id_hosts" name="hosts" placeholder="compute-[01:05].internal" required aria-required="true">
        </p>
        <p>
            <label for="id_access_level">Access Level <span aria-hidden="true" style="color: red;">*</span>:</label>
            <select id="id_access_level" name="access_level" required aria-required="true">
                <option value="NORMAL">Normal User</option>
                <option value="SUDO">Sudo Admin</option>
            </select>
        </p>
        <p>
            <label for="id_start_datetime">Start Time <span aria-hidden="true" style="color: red;">*</span>:</label>
            <input type="datetime-local" id="id_start_datetime" name="start_datetime" required aria-required="true">
        </p>
        <p>
            <label for="id_end_datetime">End Time <span aria-hidden="true" style="color: red;">*</span>:</label>
            <input type="datetime-local" id="id_end_datetime" name="end_datetime" required aria-required="true">
        </p>
        <p>
            <label for="id_motivation">Motivation <span aria-hidden="true" style="color: red;">*</span>:</label>
            <textarea id="id_motivation" name="motivation" required aria-required="true"></textarea>
        </p>
        <button type="submit">Submit Request</button>
    </form>
</body>
</html>
